[package]
name = "tiff-wasm"
version = "0.1.0"
edition = "2021"
description = "Fast TIFF decoder for WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
camera-models = { path = "../camera-models" }
scientific-image-decoders = { path = "../../crates/image-decoders", default-features = false, features = ["tiff", "exr", "png", "pfm"] }
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1.6", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for speed, not size
opt-level = 3
lto = true
codegen-units = 1

# wasm-opt (binaryen) is an optional post-processing step. Disable it so the
# build does not depend on downloading the binaryen toolchain at build time;
# the release profile above already optimizes the generated code.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
