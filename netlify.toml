[build]
  command = "pnpm --filter ply-visualizer-engine run build"
  publish = "engine/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.32.1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
