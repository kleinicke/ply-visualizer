name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:python-viewer
      - run: python -m pip install build twine numpy nbclient ipykernel "mcp>=2.2,<3"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s packages/python/tests -v
      - run: npm run build --workspace=engine
      - run: npx playwright install --with-deps chromium
        working-directory: engine
      - run: PLY_AGENT_SKIP_ALIGNMENT=1 npx playwright test local-session.spec.ts mcp-app.spec.ts mcp-depth.spec.ts --reporter=line
        working-directory: engine
      - run: PLY_AGENT_TEST_HTTP=1 npx playwright test mcp-depth.spec.ts --workers=1 --reporter=line
        working-directory: engine
      - run: python -m build packages/python --outdir dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/3d-visualizer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
