[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ply-visualizer"
version = "0.4.0.dev2"
description = "Local 3D point cloud and mesh viewer for Python and the command line"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Florian Kleinicke" }]

[project.optional-dependencies]
notebook = ["ipython>=8"]
mcp = ["mcp>=2.2,<3"]

[project.urls]
Homepage = "https://3d.f-kleinicke.de"
Repository = "https://github.com/kleinicke/ply-visualizer"
Issues = "https://github.com/kleinicke/ply-visualizer/issues"

[project.scripts]
ply-viewer = "ply_visualizer.__main__:main"
ply-viewer-mcp = "ply_visualizer.mcp_server:main"

[tool.setuptools.packages.find]
include = ["ply_visualizer*"]

[tool.setuptools.package-data]
ply_visualizer = ["_assets/**/*", "_assets/*", "_mcp_app/*"]
