[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ply-visualizer"
version = "0.1.0"
description = "Local 3D point cloud and mesh viewer for Python and the command line"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Florian Kleinicke" }]

[project.scripts]
ply-viewer = "ply_visualizer.__main__:main"

[tool.setuptools.packages.find]
include = ["ply_visualizer*"]

[tool.setuptools.package-data]
ply_visualizer = ["_assets/**/*", "_assets/*"]
