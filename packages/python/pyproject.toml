[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-visualizer"
version = "0.5.0.dev0"
description = "3D Visualizer: inspect point clouds, meshes and depth data with Python, CLI and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Florian Kleinicke" }]

[project.optional-dependencies]
headless = ["playwright>=1.58,<2"]
notebook = ["ipython>=8"]
mcp = ["mcp>=2.2,<3"]
http = ["mcp>=2.2,<3", "starlette>=0.48,<2", "uvicorn>=0.31.1,<1"]

[project.urls]
Homepage = "https://3d.f-kleinicke.de"
Repository = "https://github.com/kleinicke/ply-visualizer"
Issues = "https://github.com/kleinicke/ply-visualizer/issues"

[project.scripts]
3d-visualizer = "viz3d.__main__:main"
3d-visualizer-mcp = "viz3d.mcp_server:main"
3d-visualizer-api = "viz3d.http_api:main"

[tool.setuptools.packages.find]
include = ["viz3d*"]

[tool.setuptools.package-data]
viz3d = ["_assets/**/*", "_assets/*", "_mcp_app/*"]
