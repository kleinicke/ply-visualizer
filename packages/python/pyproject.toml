[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ply-visualizer"
version = "0.4.1"
description = "3D Visualizer: inspect point clouds, meshes and depth data with Python, CLI and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Florian Kleinicke" }]

[project.optional-dependencies]
notebook = ["ipython>=8"]
mcp = ["mcp>=2.2,<3"]
http = ["mcp>=2.2,<3", "starlette>=0.48,<2", "uvicorn>=0.31.1,<1"]

[project.urls]
Homepage = "https://3d.f-kleinicke.de"
Repository = "https://github.com/kleinicke/ply-visualizer"
Issues = "https://github.com/kleinicke/ply-visualizer/issues"

[project.scripts]
3d-visualizer = "ply_visualizer.__main__:main"
3d-visualizer-mcp = "ply_visualizer.mcp_server:main"
3d-visualizer-api = "ply_visualizer.http_api:main"
# Registry runners infer this MCP executable from the PyPI distribution name.
ply-visualizer = "ply_visualizer.mcp_server:main"
ply-viewer = "ply_visualizer.__main__:main"
ply-viewer-api = "ply_visualizer.http_api:main"
ply-viewer-mcp = "ply_visualizer.mcp_server:main"

[tool.setuptools.packages.find]
include = ["ply_visualizer*"]

[tool.setuptools.package-data]
ply_visualizer = ["_assets/**/*", "_assets/*", "_mcp_app/*"]
